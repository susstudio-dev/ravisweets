name: Deploy to Cloudflare Pages (manual fallback)

# The Cloudflare Pages Git integration is the primary deploy path — it builds
# on every push to master with the settings in DEPLOYMENT.md §2 Option B.
# This workflow is a manual fallback (needs CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repo secrets to run).
on:
  workflow_dispatch:

# Queue deploys instead of cancelling — a late commit still gets deployed.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.9'

jobs:
  deploy:
    name: Build & deploy static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable intercept route (unsupported in static export)
        run: pnpm --filter @ravisweets/storefront prepare-export:disable

      - name: Build storefront (static export)
        run: pnpm --filter @ravisweets/storefront build
        env:
          BUILD_TARGET: cloudflare
          # Cloudflare serves at the domain root — no PAGES_BASE_PATH here.
          # Supabase URL/anon key come from the committed apps/storefront/.env.production.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ravisweets.pages.dev' }}
          # Leave unset (crawl-blocked) until production photography lands;
          # flip by adding repo variable NEXT_PUBLIC_INDEXING_ENABLED=true.
          NEXT_PUBLIC_INDEXING_ENABLED: ${{ vars.NEXT_PUBLIC_INDEXING_ENABLED }}

      - name: Sanity-check output
        run: |
          for f in index.html 404.html robots.txt; do
            if [ ! -f "apps/storefront/out/$f" ]; then
              echo "::error::Static export did not produce apps/storefront/out/$f"
              exit 1
            fi
          done
          echo "robots.txt policy:"
          cat apps/storefront/out/robots.txt
          echo "Static export size:"
          du -sh apps/storefront/out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/storefront/out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'ravisweets' }}
